name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # ZONA 1: PUBLIC CLOUD (Berjalan di GitHub)
  # ==========================================
  static-security-scans:
    name: Static & Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Secret Scan (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Jika GitLeaks mendeteksi password di config.js, pipeline akan gagal di sini.

      - name: SAST Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
        # Jika Semgrep menemukan SQL Injection di app.js, pipeline akan gagal di sini.


  # ==========================================
  # ZONA 2 & 3: PRIVATE VPC (Berjalan di Server Anda)
  # ==========================================
  build-and-dynamic-scans:
    name: Build, Deploy & DAST
    needs: static-security-scans # Gerbang keamanan: Harus lulus Zona 1 dulu
    runs-on: self-hosted # Menggunakan mesin internal Anda
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t internal-web-app:latest .

      - name: SCA Scan (Trivy Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'internal-web-app:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Deploy to Internal Dev Environment
        run: |
          docker stop dev-web || true
          docker rm dev-web || true
          docker run -d -p 8080:3000 --name dev-web internal-web-app:latest

      - name: DAST Scan (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080' 
          fail_action: true